name: verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install aiohttp==3.14.3
      - run: python -m unittest discover -s scripts/tests -v
      - run: echo "HERMES_BRIDGE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: mvn -B -f backend/pom.xml test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
  postgres-neo4j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: docker compose up -d --wait postgres neo4j
      - run: docker compose exec -T postgres createdb -U brain brain_test
      - run: mvn -B -f backend/pom.xml test
        env:
          SPRING_PROFILES_ACTIVE: cloud
          DB_URL: jdbc:postgresql://localhost:5432/brain_test
          DB_USER: brain
          DB_PASSWORD: brain_demo_only
          DB_SCHEMA: brain
          ADMIN_TOKEN: fictional-ci-admin-7b3f9c10a4e562d8
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: neo4j_demo_only
          HERMES_PUBLISH_MODE: disabled
          TEST_DB_URL: jdbc:postgresql://localhost:5432/brain_test
          TEST_DB_USER: brain
          TEST_DB_PASSWORD: brain_demo_only
          TEST_NEO4J_URI: bolt://localhost:7687
      - if: always()
        run: docker compose down -v
