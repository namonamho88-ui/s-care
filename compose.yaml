name: ai-incident-brain
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${DB_PASSWORD:-brain_demo_only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 5s
      timeout: 3s
      retries: 20
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_demo_only}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_dbms_usage__report_enabled: "false"
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  jevos:
    profiles: ["local-ai"]
    platform: linux/amd64
    build: ./infra/jevos
    ports: ["127.0.0.1:8017:8017"]
    environment:
      JEV_API_KEY: ${LOCAL_JEV_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8017/health"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
  hermes:
    profiles: ["hermes"]
    build:
      context: .
      dockerfile: infra/hermes/Dockerfile
    environment:
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HERMES_LLM_MODEL: ${HERMES_LLM_MODEL:-gpt-4.1-mini}
      HERMES_PUBLISH_KEY: ${HERMES_PUBLISH_KEY:-}
    ports: ["127.0.0.1:8642:8642"]
    volumes: ["hermes_data:/data/hermes", "hermes_skills:/data/hermes/skills"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/brain
      DB_PASSWORD: ${DB_PASSWORD:-brain_demo_only}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_demo_only}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-demo-admin-change-me}
      JEV_PROVIDER: ${JEV_PROVIDER:-LOCAL}
      LOCAL_JEV_URL: ${LOCAL_JEV_COMPOSE_URL:-http://jevos:8017/v1/systemone}
      LOCAL_JEV_KEY: ${LOCAL_JEV_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-30}
      STEP_MS: ${STEP_MS:-500}
      HERMES_URL: ${HERMES_COMPOSE_URL:-http://hermes:8642/v1}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-90}
      HERMES_SKILLS_DIR: /hermes-skills
      HERMES_PUBLISH_MODE: ${HERMES_PUBLISH_MODE:-filesystem}
      HERMES_PUBLISH_URL: ${HERMES_PUBLISH_COMPOSE_URL:-http://hermes:8643}
      HERMES_PUBLISH_KEY: ${HERMES_PUBLISH_KEY:-}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["hermes_skills:/hermes-skills"]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      COOKIE_SECURE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:3100:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
  neo4j_data:
  hermes_data:
  hermes_skills:
