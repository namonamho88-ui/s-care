app:
  name: S-CARE · Dify × Hermes 지식 워크플로
  description: 가상 장애의 승인 지식 선택과 Skill 초안. DEMO/REAL 분리. 기존 Spring Boot 승인·저장·Harness와 분리된 선택형 연동 템플릿.
  icon: 🧠
  icon_background: '#D5F5F6'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - id: aab7ecaf-40da-4fa3-b117-000000000001
    name: HERMES_BASE_URL
    value: https://your-hermes-api.example.invalid/v1
    value_type: string
    description: 'REAL 전용: Dify Cloud에서 접근 가능한 전용 Hermes HTTPS /v1 주소. 끝 슬래시 제외.'
    selector:
    - env
    - HERMES_BASE_URL
  - id: aab7ecaf-40da-4fa3-b117-000000000002
    name: HERMES_API_KEY
    value: ''
    value_type: secret
    description: 'REAL 전용: Hermes API 서버 인증 키. OpenAI 키/관리자 토큰을 입력하지 마세요.'
    selector:
    - env
    - HERMES_API_KEY
  - id: aab7ecaf-40da-4fa3-b117-000000000003
    name: HERMES_MODEL
    value: hermes-agent
    value_type: string
    description: Hermes API 요청 모델 별칭. 실제 내부 LLM은 Hermes 서버 설정을 따릅니다.
    selector:
    - env
    - HERMES_MODEL
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
